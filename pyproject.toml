[project]
name = "sure-enricher"
version = "0.1.0"
description = "Enriches Sure transactions with receipts, orders, meal vouchers and Pay in 3 plans"
authors = [{ name = "Davide Depau", email = "davide@depau.eu" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "tzdata",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
    "cryptography>=50.0.2",
    "websockets>=17.4",
    "pypdf>=7.0.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
spe = "spe.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spe"
